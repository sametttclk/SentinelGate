spring:
  datasource:
    url: jdbc:h2:mem:sentinelgate_testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

sentinelgate:
  security:
    jwt:
      secret-key: SentinelGateIntegrationTestSecureKey2026SuperSecretLongKey!
      expiration-ms: 3600000

logging:
  level:
    root: WARN
    com.sentinelgate: INFO
